repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.5.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.10.0
    hooks:
      - id: mypy
        additional_dependencies:
          - behave>=1.3.0
          - Jinja2>=3.1
          - weasyprint>=63.0
          - reportlab>=4.0
          - python-docx>=1.1
          - pytest>=8.0
