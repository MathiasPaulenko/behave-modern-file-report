[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "behave-modern-file-report"
dynamic = ["version"]
description = "Document-style report formatters for Behave BDD (PDF, DOCX, TXT)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "Mathias Paulenko", email = "mathias@paulenko.com" },
]
keywords = ["behave", "bdd", "report", "pdf", "docx", "txt"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Testing :: BDD",
]
dependencies = []

[project.optional-dependencies]
behave = ["behave>=1.3.0"]
pdf = [
    "Jinja2>=3.1",
    "weasyprint>=63.0",
    "reportlab>=4.0",
]
docx = ["python-docx>=1.1"]
dev = [
    "behave-modern-file-report[all]",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "build>=1.2",
    "twine>=5.0",
]
all = [
    "behave-modern-file-report[behave]",
    "behave-modern-file-report[pdf]",
    "behave-modern-file-report[docx]",
]

[project.entry-points."behave.formatters"]
behave-modern-pdf = "behave_modern_file_report.pdf_formatter:PDFFormatter"
behave-modern-docx = "behave_modern_file_report.docx_formatter:DOCXFormatter"
behave-modern-txt = "behave_modern_file_report.txt_formatter:TXTFormatter"

[project.urls]
Homepage = "https://github.com/MathiasPaulenko/behave-modern-file-report"
Documentation = "https://github.com/MathiasPaulenko/behave-modern-file-report#readme"
Repository = "https://github.com/MathiasPaulenko/behave-modern-file-report"
Issues = "https://github.com/MathiasPaulenko/behave-modern-file-report/issues"
Changelog = "https://github.com/MathiasPaulenko/behave-modern-file-report/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "behave_modern_file_report/__init__.py"

[tool.hatch.build.targets.sdist]
include = [
    "/behave_modern_file_report",
    "/tests",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
]

[tool.hatch.build.targets.wheel]
packages = ["behave_modern_file_report"]

[tool.ruff]
target-version = "py311"
line-length = 100
lint.select = [
    "E",
    "F",
    "W",
    "I",
    "UP",
    "B",
    "C4",
    "SIM",
]
lint.ignore = []
lint.extend-safe-fixes = ["UP037"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_ignores = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "slow: marks tests as slow (deselect with -m 'not slow')",
    "integration: marks tests that require behave or optional backends",
]
addopts = [
    "--strict-markers",
    "--cov=behave_modern_file_report",
    "--cov-report=term-missing",
    "--cov-report=xml",
    "--cov-fail-under=90",
]

[tool.coverage.run]
source = ["behave_modern_file_report"]
branch = true
omit = [
    "*/tests/*",
    "*/templates/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "def __repr__",
    "if __name__ == .__main__.:",
]
